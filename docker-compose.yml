services:
  app:
    build: ./docker/app
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Zwykłe HTTP na porcie 80, bez automatycznego HTTPS z Caddy
      SERVER_NAME: ":80"
      # W sieci Dockera baza jest dostępna pod nazwą serwisu, a nie pod 127.0.0.1:3309 z .env
      DATABASE_URL: "mysql://app:app@database:3306/bom_calculator?serverVersion=8.4&charset=utf8mb4"
    ports:
      # Aplikacja pod http://127.0.0.1:8088 (link w Docker Desktop)
      - "127.0.0.1:8088:80"
    volumes:
      - .:/app
      # Osobny var/ (cache, logi), żeby nie mieszać go z cache PHP uruchamianego na hoście
      - /app/var
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/products"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Pierwszy start instaluje zależności Composera
      start_period: 300s

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bom_calculator
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      # Port 3309 na hoście, żeby nie kolidować z lokalnym MySQL na 3306; tylko localhost (słabe hasła dev)
      - "127.0.0.1:3309:3306"
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  database_data:
