services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bom_calculator
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      # Port 3309 na hoście, żeby nie kolidować z lokalnym MySQL na 3306; tylko localhost (słabe hasła dev)
      - "127.0.0.1:3309:3306"
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  database_data:
